name: Verdict Scorecard

on:
  schedule:
    - cron: "0 14 * * 6"   # Saturday 9 AM CT — after the week's verdicts have outcomes
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write   # claude-code-action exchanges an OIDC token for its GitHub credentials

jobs:
  scorecard:
    name: "Weekly verdict scorecard"
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install yfinance pandas requests

      - name: Score verdicts against actual outcomes
        uses: anthropics/claude-code-action@beta
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
          GH_TOKEN: ${{ github.token }}
        with:
          mode: agent
          model: claude-sonnet-5
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_tools: "Bash,Read,Write,Glob,Grep,LS"
          direct_prompt: |
            You are FinanceCompanion's Verdict Scorecard analyst. Today is $(date +%Y-%m-%d).
            Your job: measure whether the nightly verdicts actually worked, publish an honest
            weekly scorecard, and feed systematic failures back into stock memory.

            ## Step 1 — Compute outcomes (deterministic)
            ```bash
            python3 scripts/scorecard_compute.py
            ```
            This replays the last 45 days of verdicts against actual prices and prints a JSON
            report (also saved to /tmp/scorecard.json): forward returns by verdict (absolute AND
            excess vs. the same-day average across all tracked tickers), BUY returns by
            conviction band / signal score / 52-week range position / entry_quality / price vs.
            entry_target, target-vs-stop resolution, and notable failures.
            If it exits non-zero (price data unavailable / rate-limited), do NOT publish
            anything — print the failure reason and stop; a hollow scorecard is worse than none.

            ## Step 2 — Analyze
            Read the report and answer, with numbers:
            - Are BUYs outperforming? Lead with EXCESS return (avg_excess_5d_pct / avg_excess_21d_pct),
              not raw BUY-vs-WATCH. WATCH is ~1,900 names and moves with the market, while BUY is a
              concentrated ~5/day basket, so in a market pullback raw BUY-vs-WATCH looks terrible
              even when BUY beat the universe. Report both, but say which one is regime and which
              is selection.
            - Entry-position tracking (pre-registered hypotheses from the 2026-09 review, being
              forward-tested — report the numbers, don't rewrite the rules): BUYs in the top third
              of the 52-week range (70+) vs below; entry_quality GREAT vs FAIR; price more than 1%
              above entry_target vs at/below; and buy_by_gate (signal score >=7 AND range <70).
              State plainly whether each still holds this week and how many BUYs it has.
            - Is higher conviction actually predicting better returns (70+ vs 50-69 vs <50)?
              A conviction inversion is a calibration bug — call it out plainly.
            - Target-vs-stop ratio: are stops being hit more than targets?
            - Any single ticker with 3+ failed BUY calls in the window (check notable_failures)?

            ## Step 3 — Publish the scorecard as a GitHub issue
            ```bash
            gh label create scorecard --color 1D76DB --description "Weekly verdict scorecard" 2>/dev/null || true
            gh issue create --label scorecard --title "Verdict Scorecard — $(date +%Y-%m-%d)" --body "<markdown>"
            ```
            Body: a compact markdown table of the by-verdict and by-conviction numbers, the
            target-vs-stop ratio, your 2-3 sentence honest verdict on calibration, and the
            notable failures list. Lead with the single most important finding. No fluff.

            ## Step 4 — Stock memory: SKIP (do not write lessons)
            Do not write per-ticker lessons from repeat failures. Checked against ~11 weeks of
            data: repeat BUYs on the same ticker did no worse than first BUYs, and BUYs well
            below their 50-day average did best while BUYs near highs did worst — so "3+ failed
            BUYs on one ticker" stories and "buying oversold in a downtrend" are anecdote, not a
            pattern, and lessons built on them teach the model the wrong thing. Entry-position
            effects are system-wide (see Step 2), not per-ticker, so they don't belong in
            per-ticker memory either.
